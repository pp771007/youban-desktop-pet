[workspace]
resolver = "3"
members = ["crates/petkit", "crates/petcore", "crates/petsettings"]

[workspace.package]
version = "0.3.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }

[profile.release]
lto = true
codegen-units = 1
panic = "unwind"
