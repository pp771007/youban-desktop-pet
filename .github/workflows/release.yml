# 推 v* tag → 在 GitHub 的 Windows 機器上打包、發 Release（附 zip）。
# 測試在 ci.yml（推 main 時跑）：這裡先等同一個 commit 的 CI 結果，綠了才打包、紅了就停；
# 那個 commit 沒有 CI 紀錄（例如沒經過 main 就打 tag）才在這裡自己測。
# 手動執行（Actions 頁的 Run workflow）只打包、把 zip 留在執行紀錄裡，不發 Release —— 用來先確認建置沒壞。
# Release 說明取自 tag 的訊息：`git tag -a v0.2.0 -m "給玩家看的更新說明"`。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  actions: read # 查 ci.yml 的執行結果

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: tag 要跟 Cargo.toml 的版號一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} 跟 Cargo.toml 的版號 $version 不一樣" }

      - name: 等這個 commit 的 CI 結果
        id: ci
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          # main 和 tag 一起推時，CI 要過一下子才查得到；等這麼久都查不到就當作這個 commit 沒跑過 CI
          NO_RUN_GRACE_SECS: 120
          POLL_SECS: 20
        run: |
          $deadline = (Get-Date).AddSeconds([int]$env:NO_RUN_GRACE_SECS)
          while ($true) {
            $json = gh run list --repo "${{ github.repository }}" --workflow ci.yml --commit "${{ github.sha }}" --json databaseId,status,conclusion --limit 1
            $run = if ($LASTEXITCODE -eq 0 -and $json) { $json | ConvertFrom-Json | Select-Object -First 1 }
            if ($run -and $run.status -eq 'completed') {
              $url = "https://github.com/${{ github.repository }}/actions/runs/$($run.databaseId)"
              if ($run.conclusion -eq 'success') { Write-Host "CI 綠了：$url"; exit 0 }
              throw "這個 commit 的 CI 沒過（$($run.conclusion)），不打包：$url。修好再發；若是 GitHub 自己出狀況，在那頁重新執行 CI，綠了再重新執行這個工作。"
            }
            if ($run) {
              Write-Host "CI 還在跑（$($run.status)），$($env:POLL_SECS) 秒後再看"
            } elseif ((Get-Date) -gt $deadline) {
              Write-Host '這個 commit 沒有 CI 紀錄，改在這裡跑測試'
              Add-Content -Path $env:GITHUB_OUTPUT -Value 'need_test=true'
              exit 0
            }
            Start-Sleep -Seconds ([int]$env:POLL_SECS)
          }

      - name: 測試（這個 commit 沒有 CI 紀錄時）
        if: steps.ci.outputs.need_test == 'true'
        run: cargo test

      - name: 裝 Inno Setup（做安裝程式用；語言檔要 6.5 以上）
        run: choco upgrade innosetup -y --no-progress

      - name: 打包
        shell: pwsh
        run: ./scripts/package.ps1

      - name: 留一份 zip 在執行紀錄
        uses: actions/upload-artifact@v7
        with:
          name: zip
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.sha256
            dist/pets/*.zip

      - name: 發 Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 說明 = tag 訊息 ＋ 下載哪個 ＋ 每個檔的 SHA-256（玩家下載後可以自己比對）
          $setup = Get-Item dist/*-setup-*.exe
          $zip = Get-Item dist/*.zip
          $hashOf = { param($f) (Get-Content "$($f.FullName).sha256" -Raw).Split(' ')[0] }
          $notes = (git tag -l --format='%(contents)' "${{ github.ref_name }}") -join "`n"
          $notes += "`n`n### 下載哪一個`n`n- **``$($setup.Name)``**：安裝版（建議），會建開始選單捷徑，也能從「設定 → 應用程式」移除`n- **``$($zip.Name)``**：免安裝版，解開執行 ``Youban.exe```n"
          $notes += "`n### 檔案驗證（SHA-256）`n`n| 檔案 | SHA-256 |`n|---|---|`n| ``$($setup.Name)`` | ``$(& $hashOf $setup)`` |`n| ``$($zip.Name)`` | ``$(& $hashOf $zip)`` |`n`n下載後在 PowerShell 執行 ``Get-FileHash <檔名>``，算出來的值跟上面一樣就是完整、沒被改過的檔案。`n"
          [System.IO.File]::WriteAllText("$PWD/notes.md", $notes)
          # 預設以外的桌寵：程式第一次用到時從這一版的附件下載（pet-<id>.zip）
          $pets = (Get-ChildItem dist/pets/*.zip).FullName
          gh release create "${{ github.ref_name }}" $setup.FullName "$($setup.FullName).sha256" $zip.FullName "$($zip.FullName).sha256" @pets --title "柚伴 ${{ github.ref_name }}" --notes-file notes.md
