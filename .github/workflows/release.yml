# 推 v* tag → 在 GitHub 的 Windows 機器上測試、打包、發 Release（附 zip）。
# 手動執行（Actions 頁的 Run workflow）只測試和打包、把 zip 留在執行紀錄裡，不發 Release —— 用來先確認建置沒壞。
# Release 說明取自 tag 的訊息：`git tag -a v0.2.0 -m "給玩家看的更新說明"`。
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: tag 要跟 Cargo.toml 的版號一致
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") { throw "tag ${{ github.ref_name }} 跟 Cargo.toml 的版號 $version 不一樣" }

      - name: 測試
        run: cargo test

      - name: 打包
        shell: pwsh
        run: ./scripts/package.ps1

      - name: 留一份 zip 在執行紀錄
        uses: actions/upload-artifact@v7
        with:
          name: zip
          path: |
            dist/*.zip
            dist/*.sha256

      - name: 發 Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 說明 = tag 訊息 ＋ SHA-256 驗證碼與驗證方法（玩家下載後可以自己比對）
          $zip = Get-Item dist/*.zip
          $hash = (Get-Content "$($zip.FullName).sha256" -Raw).Split(' ')[0]
          $notes = (git tag -l --format='%(contents)' "${{ github.ref_name }}") -join "`n"
          $notes += "`n`n### 檔案驗證`n`nSHA-256：``$hash```n`n下載後在 PowerShell 執行 ``Get-FileHash $($zip.Name)``，算出來的值跟上面一樣就是完整、沒被改過的檔案。`n"
          [System.IO.File]::WriteAllText("$PWD/notes.md", $notes)
          gh release create "${{ github.ref_name }}" $zip.FullName "$($zip.FullName).sha256" --title "柚伴 ${{ github.ref_name }}" --notes-file notes.md
